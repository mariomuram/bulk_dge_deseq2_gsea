# Sample label parsing
# Each value in `samples:` below is parsed against this pattern
# to derive the design's factor columns. Field names in {} must
# match design.formula and design.reference_levels exactly.
sample_label_pattern: "{background}_{dox}"

# Sample Information (for reproducibility)
files:
  results:
    path: "data/quantification/star_rsem/rsem.merged.gene_counts.tsv"
    samples:
      iHSC_CBi08_dCas9rtTA_lib15_dox_1: "parental_dox"
      iHSC_CBi08_dCas9rtTA_lib15_dox_2: "parental_dox"
      iHSC_GATA2R396Q_dCas9rtTA_lib15_1: "GATA2R396Q_nodox"
      iHSC_GATA2R396Q_dCas9rtTA_lib15_2: "GATA2R396Q_nodox"
      iHSC_GATA2R396Q_dCas9rtTA_lib15_dox_1: "GATA2R396Q_dox"
      iHSC_GATA2R396Q_dCas9rtTA_lib15_dox_2: "GATA2R396Q_dox"
  # Note: The above file actually contains columns for the below
  # samples as well. However, Eric did explicitly feed the version
  # from the separate file below to DESeq2 for these samples
  # specifically. Why he did this and what is the difference between
  # the two files has not been documented. However, while the
  # `parental_nodox` samples nicely separate into their own quadrant
  # in a PCA with the above samples when using data from the above
  # file only, adding the `parental_clean` ones from the same file
  # shows that they are completely different from the others, as if
  # they belong to another time point or cell type or the like.
  # Based on Eric's results, this is not the case when using the
  # results from the columns labelled with the same samples from the
  # file below. Thus, Maria and me decided to confirm Eric's results
  # and follow his steps even if we do not understand the reasoning
  # behind them. We have reached out to him and hope to get clarity
  # regarding this oddity soon. Otherwise, the quantification should
  # eventually be repeated independently from scratch using the exact
  # same code for all samples.
  # TODO: Update based on Eric's feedback.
  results_benchmarking:
    path: "data/quantification/star_rsem/rsem.benchmarking_merged.gene_counts.tsv"
    samples:
      iHSC_CBi08_dCas9rtTA_lib15_1: "parental_nodox"
      iHSC_CBi08_dCas9rtTA_lib15_2: "parental_nodox"
#      iHSC_CBi08_1: "parental_clean"
#      iHSC_CBi08_2: "parental_clean"

# The design is always the full crossing (all main effects and
# interactions) of every parsed sample field -- built and fit
# as an explicit model matrix in deseq2_fit.R, not a formula
# string here. There is exactly one correct such matrix once
# the fields and reference levels are fixed, so there is no
# `formula` key to set: a hand-typed formula could only ever be
# this one (if valid) or wrong (if not), and a typed formula
# also can't express the "drop structurally-empty coefficients"
# handling needed once fields don't form a complete factorial
# (e.g. once 'clean' samples, with no GATA2R396Q counterpart,
# are added back in).
design:
  reference_levels:
    background: "parental"
    dox: "nodox"
    # Any field omitted here defaults to its lexicographically
    # smallest observed value (resolved in the Snakefile).
    # This choice is cosmetic only -- it affects resultsNames()
    # labels for manual/interactive use, not any contrast value
    # computed by this workflow.

# Contrasts: either `numerator`/`denominator` (extracted via a
# dds releveled to `denominator`, see deseq2_relevel.R) or an
# explicit `groups` dict of condition -> weight (extracted via
# a group-averaged model-matrix contrast against the primary
# full-crossing dds).
contrasts:
#  CBi08_nodox_vs_clean:
#    numerator: "parental_nodox"
#    denominator: "parental_clean"
  GATA2_dox_vs_nodox:
    numerator: "GATA2R396Q_dox"
    denominator: "GATA2R396Q_nodox"
  CBi08_dox_vs_nodox:
    numerator: "parental_dox"
    denominator: "parental_nodox"
  GATA2_dox_vs_CBi08_nodox:
    numerator: "GATA2R396Q_dox"
    denominator: "parental_nodox"
  GATA2_nodox_vs_CBi08_nodox:
    numerator: "GATA2R396Q_nodox"
    denominator: "parental_nodox"
  GATA2_specific_response:
    groups:
      GATA2R396Q_dox: 1
      GATA2R396Q_nodox: -1
      parental_dox: -1
      parental_nodox: 1

# DESeq2 Parameters
deseq2:
  padj_threshold: 0.05
  log2fc_threshold: 0.0

# GSEA Parameters
gsea:
  gobp:
    database: "GO"
    ontology: "BP"
    min_set_size: 5
    max_set_size: 500
    padj_threshold: 0.05
    ranking_stat: "stat"

  hallmark:
    database: "HALLMARK"
    min_set_size: 5
    max_set_size: 500
    padj_threshold: 0.05
    ranking_stat: "stat"

gsea_summary:
  heatmap_top_n: 60

# Output Directory
output_dir: "results"
