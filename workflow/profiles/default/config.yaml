###########
# Options #
###########

# The workflow specifies its dependencies as Conda environments (see
# `workflow/envs`) and the README recommends installing Snakemake itself
# via Conda.
# Thus, enabling Conda integration by default increases reproducibility.
# Note: The main Snakefile (`workflow/Snakefile`) defines the minimum Snakemake
# version supported by the workflow as >= v. 8.0.0.
# Thus, according to
# https://snakemake.readthedocs.io/en/stable/getting_started/migration.html#migrating-to-snakemake-8,
# `--use-conda` should be considered deprecated and `--sdm=conda` can be used
# instead.
software-deployment-method: conda
